<title>The Fantasy League Weekly Report</title>
<style>
:root{

}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--canvas)}
body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;line-height:1.4}
.report{width:min(1280px,calc(100% - 28px));margin:24px auto 72px;background:var(--paper);border:1px solid #cbd2d9}
.masthead{border-top:7px solid var(--navy);padding:32px 40px 24px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;border-bottom:1px solid var(--rule-dark)}
.kicker,.section-kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:850;color:var(--gold)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;color:#111820}
h1{font-size:42px;line-height:1.04;letter-spacing:-.025em;margin-top:4px}
.meta{text-align:right;color:var(--muted);font-size:13px}.meta strong{display:block;color:var(--ink);font-size:15px}
.intro{display:grid;grid-template-columns:1.25fr .75fr;gap:36px;padding:26px 40px 30px;border-bottom:1px solid var(--rule)}
.intro h2{font-size:28px;margin-bottom:10px}.intro p{margin:0;color:#515d68;font-size:14px;max-width:760px}
.issuebox{border:1px solid var(--rule);display:grid;grid-template-columns:repeat(3,1fr);align-self:start}.issuebox div{padding:13px}.issuebox div+div{border-left:1px solid var(--rule)}
.label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:850}.big{font-size:20px;font-weight:850;color:var(--navy);margin-top:4px}
.index{padding:22px 40px 26px;border-bottom:1px solid var(--rule);background:#fbfcfd}
.index-title{font-weight:850;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--navy);margin-bottom:12px}
.index-grid{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--rule-dark);border-left:1px solid var(--rule)}
.index-grid a{text-decoration:none;color:var(--ink);padding:12px 13px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:12px;min-height:63px;display:block}
.index-grid a span{display:block;font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:700;margin-top:3px}.index-grid a:hover{background:var(--soft-blue)}
.section{padding:32px 40px 36px;border-bottom:1px solid var(--rule)}
.section-head{display:grid;grid-template-columns:minmax(280px,.8fr) 1.2fr;gap:36px;align-items:end;margin-bottom:20px}.section-head h3{font-size:27px;margin-top:4px}.deck{margin:0;color:#596570;font-size:13px}
.table-wrap{width:100%;overflow:auto;border:1px solid var(--rule)}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
th{background:#f6f8fa;color:#33404c;text-transform:uppercase;letter-spacing:.055em;font-size:9px;font-weight:850;padding:8px 9px;border-bottom:1px solid var(--rule-dark);white-space:nowrap;text-align:right}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:2;box-shadow:2px 0 0 var(--rule)}
th:first-child{background:#f6f8fa;z-index:3}
tbody td:first-child{background:#fff}
tbody tr:nth-child(even) td:first-child{background:#fbfcfd}
tbody tr:hover td:first-child{background:#f3f7fa}
td{padding:7px 9px;border-bottom:1px solid #e5e9ed;text-align:right;white-space:nowrap}
tbody tr:nth-child(even){background:#fbfcfd}tbody tr:hover{background:#f3f7fa}.manager{font-weight:780;color:#1d2b37}.muted{color:var(--muted)}
.pos{background:var(--soft-green)!important;color:#215a43;font-weight:760}.neg{background:var(--soft-red)!important;color:#8b3434;font-weight:760}.neutral{background:var(--soft-gray)!important}
.note{margin-top:12px;color:#66727e;font-size:11px}.tiny-note{margin-top:10px;color:#7b858e;font-size:10px}
.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--rule);background:#fff}.card-head{padding:10px 12px;border-bottom:1px solid var(--rule);background:#f8fafb;display:flex;justify-content:space-between;gap:12px;align-items:baseline}.card-title{font-family:Georgia,"Times New Roman",serif;font-weight:700}.card-sub{font-size:10px;color:var(--muted)}
.matrix-wrap{width:100%;overflow:auto;border:1px solid var(--rule)}.matrix{min-width:max-content}.matrix th,.matrix td{min-width:48px;text-align:center;padding:6px 7px}.matrix th:first-child,.matrix td:first-child{min-width:125px;text-align:left}.matrix td.diag{background:var(--soft-gold);font-weight:850}.matrix td.zero{color:#a1a9b0}
.manager-selector{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px;font-weight:700}.manager-selector select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--rule-dark);padding:8px 12px;max-width:100%}.grid-stack{grid-template-columns:minmax(0,1fr)}.grid-stack>*{min-width:0}.manager-card{border:1px solid var(--rule)}.manager-card h4{font-family:Georgia,"Times New Roman",serif;font-size:16px;margin:0;padding:9px 11px;background:#f7f9fa;border-bottom:1px solid var(--rule)}
.metric-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}.metric{border:1px solid var(--rule);padding:10px 11px}.metric b{display:block;font-size:18px;color:var(--navy)}.metric span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:750}
.odds{border:1px solid var(--rule)}.odds-row{display:grid;grid-template-columns:130px 1fr 62px 80px;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid #e6eaee;font-size:11px}.odds-row:last-child{border-bottom:0}.odds-track{height:8px;background:#e6ebef;position:relative}.odds-track>span{display:block;height:100%;background:var(--navy-2)}.odds-pct{font-weight:800;text-align:right}.odds-last{text-align:right;color:var(--muted)}
.chartbox{border:1px solid var(--rule);padding:14px 14px 10px}.chart-title{font-family:Georgia,"Times New Roman",serif;font-weight:700;margin-bottom:12px}.stack-chart{height:260px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--rule-dark);padding:0 8px}.barcol{height:100%;flex:1;min-width:42px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}.stack{height:var(--h);display:flex;flex-direction:column-reverse}.seg{display:block}.s1{background:#355f80}.s2{background:#759066}.s3{background:#a9aa9d}.s4{background:#b67e58}.barlabel{font-size:9px;text-align:center;padding-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:10px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.empty{padding:16px;border:1px dashed var(--rule-dark);color:var(--muted);font-size:12px;background:#fbfcfd}
.footer{display:flex;justify-content:space-between;gap:20px;padding:18px 40px 22px;font-size:10px;color:var(--muted)}
@media(max-width:850px){.report{width:100%;margin:0;border:0}.masthead,.intro,.section-head{grid-template-columns:1fr}.masthead,.intro,.index,.section{padding-left:18px;padding-right:18px}.meta{text-align:left}.index-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-3{grid-template-columns:1fr}.odds-row{grid-template-columns:100px 1fr 55px}.odds-last{display:none}.stack-chart{overflow-x:auto}.footer{padding-left:18px;padding-right:18px}}
@media print{html,body{background:#fff}.report{width:100%;margin:0;border:0}.index{display:none}.section{break-inside:avoid}.table-wrap,.matrix-wrap{overflow:visible}.footer{border-top:1px solid var(--rule)}}

.metric-help{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;border-bottom:1px dotted var(--muted);padding:4px 0;cursor:help}
.metric-help::after{content:' ⓘ';color:var(--navy)}
.metric-help:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.metric-tooltip{position:fixed;z-index:1000;width:min(360px,calc(100vw - 24px));padding:12px 15px;background:var(--navy);color:white;border-radius:6px;box-shadow:0 4px 18px #0003;font-size:13px;line-height:1.5;text-align:left}
.metric-tooltip[hidden]{display:none}
@media print{.metric-tooltip{display:none}.metric-help::after{content:''}}

<script>
(() => {
  const data = JSON.parse(document.getElementById('report-data').textContent);
  const teamMap = new Map((data.teams || []).map(t => [String(t.team_id), t]));
  const manager = id => teamMap.get(String(id))?.manager ?? String(id);
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const n = (value, digits=2) => value == null || value === '' ? '—' : Number(value).toFixed(digits);
  const pct = value => value == null || value === '' ? '—' : `${(Number(value)*100).toFixed(1)}%`;
  const pctPoint = value => value == null || value === '' ? '—' : `${Number(value).toFixed(1)}%`;
  const signClass = value => Number(value) > 10 ? 'pos' : Number(value) < -10 ? 'neg' : '';
  const ratioClass = value => Number(value) >= 1.1 ? 'pos' : Number(value) <= .9 ? 'neg' : '';
  const sectionDefs = [
    ['boned','01','Standings','Standings'],
    ['boned-total','02','Luck / schedule','Boned Index'],
    ['freaky','03','Schedule strength','Freaky Friday'],
    ['bhole','04','Close games','Between High Over Low Evaluation'],
    ['studs','05','Player volatility','Studs to Duds Analysis'],
    ['grower','06','Expected wins','Grower or Shower'],
    ['expertise','07','Lineup management','Managerial Expertise'],
    ['vobl','08','Roster value','Value Over Baseline — Expanded'],
    ['playoffs','09','Season outlook','Playoff Odds'],
    ['draft','10','Draft capital',"It's Not The Size of Your Draft, It's How You Use It"]
  ];

  document.title = `${data.meta?.title || 'Fantasy Report'} — ${data.meta?.league_name || ''}`;
  document.getElementById('title').textContent = data.meta?.title || 'The Fantasy League Weekly Report™';
  document.getElementById('league-name').textContent = data.meta?.league_name || 'League';
  document.getElementById('season-week').textContent = `${data.meta?.season ?? ''} · Through Week ${data.meta?.current_week ?? ''}`;
  document.getElementById('intro-title').textContent = `${data.meta?.season ?? ''} Fantasy Football Analytics`;
  document.getElementById('intro-copy').textContent = data.meta?.intro || '';
  document.getElementById('issue-league').textContent = data.meta?.league_name || '—';
  document.getElementById('issue-week').textContent = `Week ${data.meta?.current_week ?? '—'}`;
  document.getElementById('issue-teams').textContent = (data.teams || []).length;
  document.getElementById('footer-generated').textContent = data.meta?.generated_at ? `Generated ${data.meta.generated_at}` : '';
  document.getElementById('report-index').innerHTML = sectionDefs.map(([id,num,kicker,title]) => `<a href="#${id}"><small>${num} · ${esc(kicker)}</small><span>${esc(title)}</span></a>`).join('');

  const sectionShell = (id,num,kicker,title,description,body) => `
    <section class="section" id="${id}">
      <div class="section-head"><div><div class="section-kicker">${num} · ${esc(kicker)}</div><h3>${esc(title)}</h3></div><p class="deck">${esc(description || '')}</p></div>
      ${body || '<div class="empty">No data supplied for this section.</div>'}
    </section>`;

  function renderStandings(s){
    if(!s?.rows?.length)return '';
    const groups=new Map();
    s.rows.forEach(row=>{const key=s.has_divisions?row.division_id:'league';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row);});
    const tables=[...groups.values()].map(rows=>{
      const title=s.has_divisions?rows[0].division_name:'League standings';
      const body=rows.map(r=>`<tr><td class="manager">${esc(manager(r.team_id))}</td>${s.has_divisions?`<td>${r.division_rank??'—'}</td>`:''}<td>${r.overall_rank??'—'}</td><td>${r.wins??'—'}</td><td>${r.losses??'—'}</td><td>${r.ties??'—'}</td><td>${pct(r.win_pct)}</td><td>${n(r.points_for)}</td><td>${n(r.points_against)}</td>${s.has_divisions?`<td>${r.division_wins??'—'}</td><td>${r.division_losses??'—'}</td><td>${r.division_ties??'—'}</td>`:''}</tr>`).join('');
      return `<h4>${esc(title)}</h4><div class="table-wrap"><table><thead><tr><th>Team</th>${s.has_divisions?'<th>Division rank</th>':''}<th>${s.has_divisions?'Overall rank':'Rank'}</th><th>W</th><th>L</th><th>T</th><th>Win %</th><th>Points for</th><th>Points against</th>${s.has_divisions?'<th>Division W</th><th>Division L</th><th>Division T</th>':''}</tr></thead><tbody>${body}</tbody></table></div>`;
    }).join('');
    return `<div class="standings">${tables}</div>`;
  }

  function renderBoned(){
    const s=data.boned_index?.standings;
    return sectionShell('boned','01','Standings','Standings',s?.description,renderStandings(s));
  }

  function renderBonedTotal(){
    const s=data.boned_index;if(!s)return '';
    const weeks=s.weeks||[];
    const head=['<th>Manager</th>',...weeks.flatMap(w=>[`<th>Through Week ${w}</th>`,`<th>Rank</th>`]),'<th>Difference</th><th>Rank Δ</th>'].join('');
    const rows=(s.rows||[]).map(r=>`<tr><td class="manager">${esc(manager(r.team_id))}</td>${weeks.map(w=>`<td class="${signClass(r.values?.[w])}">${pctPoint(r.values?.[w])}</td><td>${r.ranks?.[w]??'—'}</td>`).join('')}<td class="${signClass(r.difference)}">${pctPoint(r.difference)}</td><td>${r.rank_delta??'—'}</td></tr>`).join('');
    const body=weeks.length?`<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div><p class="note">Each week column is the cumulative index through that week. Difference and rank change compare the last two report weeks; — means unavailable.</p>`:'<div class="empty">The total index becomes available from Week 2, once opponents have scores against other teams to compare. Week 1 has no comparison baseline.</div>';
    return sectionShell('boned-total','02','Luck / schedule','Boned Index',s.description,`<h4>Total index</h4>${body}${renderBonedDetail()}`);
  }

  function renderBonedDetail(){
    const s=data.boned_detail;if(!s)return '';
    const managers=s.managers||[];
    const options=managers.map((m,i)=>`<option value="${i}">${esc(manager(m.team_id))}</option>`).join('');
    const cards=managers.map((m,i)=>{
      const rows=(m.rows||[]).map(r=>`<tr><td>${r.week}</td><td>${esc(r.opponent)}</td><td>${n(r.opponent_score)}</td><td>${r.opponent_games ?? '—'}</td><td>${n(r.opponent_avg)}</td><td class="${ratioClass(r.ratio)}">${n(r.ratio)}</td></tr>`).join('');
      const a=m.averages||{};
      return `<div class="manager-card" data-manager-index="${i}"${i ? ' hidden' : ''}><h4>${esc(manager(m.team_id))}</h4><div class="table-wrap"><table><thead><tr><th>Week</th><th>Opponent</th><th>Opp. score</th><th>Games</th><th>Opp. avg</th><th>Ratio</th></tr></thead><tbody>${rows}<tr><td colspan="2" class="manager">Average</td><td>${n(a.opponent_score)}</td><td>—</td><td>${n(a.opponent_avg)}</td><td class="${ratioClass(a.ratio)}">${n(a.ratio)}</td></tr></tbody></table></div></div>`;
    }).join('');
    return `<div id="boned-detail" style="margin-top:28px"><h4>By manager and week</h4><p class="note">${esc(s.description)}</p> ${managers.length ? `<div class="manager-selector"><label for="boned-manager">Manager</label><select id="boned-manager" aria-controls="boned-manager-detail">${options}</select></div>` : ''}<div id="boned-manager-detail">${cards || '<div class="empty">No manager detail supplied.</div>'}</div></div>`;
  }

  function matrixTable(matrix, diagonal=true){
    const teams=data.teams||[];
    return `<div class="matrix-wrap"><table class="matrix"><thead><tr><th>Manager</th>${teams.map(t=>`<th>${esc(t.manager)}</th>`).join('')}</tr></thead><tbody>${teams.map(row=>`<tr><td class="manager">${esc(row.manager)}</td>${teams.map(col=>{const v=matrix?.[row.team_id]?.[col.team_id];const cls=diagonal&&row.team_id===col.team_id?'diag':Number(v)===0?'zero':'';return `<td class="${cls}">${v ?? '—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  function renderFreaky(){
    const s=data.freaky_friday;if(!s)return '';
    const summary=(s.schedule_swap?.summary||[]).map(r=>`<tr><td class="manager">${esc(manager(r.team_id))}</td><td>${r.total ?? '—'}</td><td>${r.rank ?? '—'}</td><td>${r.max ?? '—'}</td><td>${n(r.avg)}</td><td>${r.min ?? '—'}</td></tr>`).join('');
    const body=`<div class="grid grid-stack"><div class="card"><div class="card-head"><span class="card-title">Played This Manager's Schedule</span><span class="card-sub">wins by schedule swap</span></div>${matrixTable(s.schedule_swap?.matrix)}</div><div class="card"><div class="card-head"><span class="card-title">Schedule Swap Summary</span><span class="card-sub">total / rank / range</span></div><div class="table-wrap"><table><thead><tr><th>Manager</th><th>Total</th><th>Rank</th><th>Max</th><th>Avg</th><th>Min</th></tr></thead><tbody>${summary}</tbody></table></div></div><div class="card"><div class="card-head"><span class="card-title">Head to Head Wins</span><span class="card-sub">wins if this manager played that manager</span></div>${matrixTable(s.head_to_head?.matrix)}</div></div>`;
    return sectionShell('freaky','03','Schedule strength','Freaky Friday',s.description,body);
  }

  function renderBhole(){
    const s=data.bhole;if(!s)return '';
    const d=s.deltas||[];
    const rows=(s.rows||[]).map(r=>`<tr><td class="manager">${esc(manager(r.team_id))}</td>${d.map(x=>`<td>${r.wins?.[x] ?? '—'}</td>`).join('')}<td>${r.range ?? '—'}</td><td>${n(r.avg_width,1)}</td></tr>`).join('');
    return sectionShell('bhole','04','Close games','Between High Over Low Evaluation',s.description,`<div class="table-wrap"><table><thead><tr><th>Team</th>${d.map(x=>`<th>${Number(x)>0?'+':''}${x}</th>`).join('')}<th>Range</th><th>Avg width</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  }

  function renderStuds(){
    const s=data.studs_duds;if(!s)return '';
    const rows=(s.rows||[]).map(r=>`<tr><td class="manager">${esc(manager(r.team_id))}</td><td>${r.studs ?? '—'}</td><td>${r.studded_on ?? '—'}</td><td>${r.duds ?? '—'}</td><td>${r.dudded_on ?? '—'}</td><td class="${Number(r.s2d_diff)>0?'pos':Number(r.s2d_diff)<0?'neg':''}">${r.s2d_diff ?? '—'}</td></tr>`).join('');
    return sectionShell('studs','05','Player volatility','Studs to Duds Analysis',s.description,`<div class="table-wrap"><table><thead><tr><th>Team</th><th>Studs</th><th>Stud-ed on</th><th>Duds</th><th>Dud-ed on</th><th>S2D diff</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  }

  function renderGrower(){
    const s=data.grower_shower;if(!s)return '';
    const weeks=s.weeks||[];
    const weights=s.weights||{};
    const weightStrip=`<div class="metric-strip"><div class="metric"><b>${pct(weights.expected_wins)}</b><span>Expected wins weight</span></div><div class="metric"><b>${pct(weights.actual_vs_opp_avg)}</b><span>Actual vs opp avg</span></div><div class="metric"><b>${pct(weights.avg_vs_opp_actual)}</b><span>Avg vs opp actual</span></div><div class="metric"><b>${pct(weights.avg_vs_opp_avg)}</b><span>Avg vs opp avg</span></div></div>`;
    const rows=(s.rows||[]).map(r=>`<tr><td class="manager">${esc(manager(r.team_id))}</td>${weeks.map(w=>`<td>${n(r.weekly_probability?.[w],2)}</td>`).join('')}<td>${n(r.expected_wins,2)}</td><td>${r.actual_vs_opp_avg ?? '—'}</td><td>${r.avg_vs_opp_actual ?? '—'}</td><td>${r.avg_vs_opp_avg ?? '—'}</td><td>${r.actual_wins ?? '—'}</td><td class="${ratioClass(r.ratio)}">${n(r.ratio,2)}</td><td>${r.rank ?? '—'}</td></tr>`).join('');
    return sectionShell('grower','06','Expected wins','Grower or Shower',s.description,`${weightStrip}<div class="table-wrap"><table><thead><tr><th>Team</th>${weeks.map(w=>`<th>W${w}</th>`).join('')}<th>Exp wins</th><th>Act vs opp avg</th><th>Avg vs opp act</th><th>Avg vs opp avg</th><th>Actual wins</th><th>G/S ratio</th><th>Rank</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  }

  const expertiseHelp={
  "team_id": "The fantasy team or manager. All totals and counts cover the weeks included in this report.",
  "actual_points": "Total fantasy points scored by the players you actually started across the report weeks.",
  "optimal_points": "The most points your roster could have scored with the best legal starting lineup each week, chosen after seeing actual scores. Includes playable bench players; excludes IR/NA slots.",
  "efficiency": "Actual points divided by optimal points across the report weeks. 100% means you captured every available lineup point.",
  "using_yahoo_games": "Weeks when your starters matched the highest possible projected-point total for a legal lineup from your roster. This measures agreement with Yahoo projections, not whether you used a Yahoo lineup tool. Tied projected totals count as matching.",
  "using_yahoo_efficiency": "Actual points divided by optimal points, using only weeks when your starting lineup matched the highest projected-point total. This is a ratio of totals, not an average of weekly percentages.",
  "not_using_yahoo_games": "Weeks when your starters did not match the highest possible projected-point total for a legal lineup from your roster.",
  "not_using_yahoo_efficiency": "Actual points divided by optimal points, using only weeks when your lineup did not match the highest projected-point total. This is a ratio of totals, not an average of weekly percentages.",
  "wins_added": "Positive changes in matchup results from your actual lineup versus the lineup with the highest Yahoo projection, both scored using actual points against the same opponent. A win counts as 1, a tie as 0.5, and a loss as 0. Example: turning a projected-lineup loss into an actual win adds 1.",
  "losses_added": "Negative changes in matchup results from your actual lineup versus the lineup with the highest Yahoo projection. Shown as a negative number: turning a projected-lineup win into an actual loss contributes -1. Ties can contribute -0.5.",
  "net_added": "Wins added plus the negative losses-added total. Positive means your lineup choices improved matchup results compared with following the highest Yahoo-projected lineup; negative means they hurt.",
  "sheep_pct": "Share of report weeks in which your starters matched the highest possible Yahoo-projected lineup total: Yahoo games divided by all games.",
  "plums": "Non-Yahoo efficiency divided by Yahoo efficiency, displayed as a percentage. Above 100% means you captured a larger share of available points in weeks you departed from projections. All Balls / No projection-aligned games means there were no matching weeks. Unavailable if either efficiency is missing or Yahoo efficiency is zero.",
  "vobl": "Value Over Baseline League: actual starter points minus the league-wide replacement baseline, summed across weeks. With N teams, each slot uses the Nth remaining eligible scorer after earlier slots consume their top N players; flex uses the remaining pool. Positive means above baseline.",
  "vobm": "Value Over Baseline Market: actual starter points minus the points from the best legal lineup of that week’s unrostered free agents, summed across weeks. The comparison uses actual scores in hindsight, with each free agent used once. Positive means above the market lineup.",
  "wobl": "Wins Over Baseline League: count of weeks your actual starter total beat the league baseline lineup. A tie counts as 0.5 and a loss as 0. This is a comparison-win count, not wins added to your league record.",
  "wobm": "Wins Over Baseline Market: count of weeks your actual starter total beat the best legal free-agent lineup. A tie counts as 0.5 and a loss as 0. This is a comparison-win count, not wins added to your league record.",
  "all_studs": "Rostered player-week performances with at least 20 actual points AND more than twice their projected points. Includes starters and non-starters; the same player can count in multiple weeks.",
  "studs_benched": "Qualifying standout performances from players you did not start: at least 20 actual points AND more than twice their projection. Counts player-weeks, including non-starting reserve slots.",
  "all_duds": "Rostered player-week performances with a projection of at least 10 points AND actual points at or below 25% of that projection. Includes starters and non-starters; the same player can count in multiple weeks.",
  "duds_started": "Qualifying underperformances from players you started: projected for at least 10 points but scored at or below 25% of that projection. Counts player-weeks."
};
  const expertiseHeader=(key,label)=>`<th scope="col"><button type="button" class="metric-help" data-metric-help="${key}">${esc(label)}</button></th>`;

  function renderExpertise(){
    const s=data.managerial_expertise;if(!s)return '';
    const cols=[['actual_points','Actual pts',v=>n(v)],['optimal_points','Optimal pts',v=>n(v)],['efficiency','Efficiency',pct],['using_yahoo_games','Yahoo games',v=>v??'—'],['using_yahoo_efficiency','Yahoo eff.',pct],['not_using_yahoo_games','Non-Yahoo games',v=>v??'—'],['not_using_yahoo_efficiency','Non-Yahoo eff.',pct],['wins_added','Wins +',v=>v??'—'],['losses_added','Losses +',v=>v??'—'],['net_added','Net',v=>v??'—'],['sheep_pct','% Sheep',pct],['plums','Plums',v=>v??'—'],['vobl','VOBL',v=>n(v)],['vobm','VOBM',v=>n(v,1)],['wobl','WOBL',v=>v??'—'],['wobm','WOBM',v=>v??'—'],['all_studs','Studs',v=>v??'—'],['studs_benched','Studs benched',v=>v??'—'],['all_duds','Duds',v=>v??'—'],['duds_started','Duds started',v=>v??'—']];
    const rows=(s.rows||[]).map(r=>`<tr><td class="manager">${esc(manager(r.team_id))}</td>${cols.map(([k,,f])=>`<td>${esc(f(r[k]))}</td>`).join('')}</tr>`).join('');
    return sectionShell('expertise','07','Lineup management','Managerial Expertise',s.description,`<p class="note">Hover, focus, or tap a column heading for its definition. All metrics cover the report weeks; — means unavailable, not zero.</p><div class="table-wrap"><table><thead><tr>${expertiseHeader('team_id','Team')}${cols.map(([k,h])=>expertiseHeader(k,h)).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`);
  }

  function baselineViews(metric){
    const s=data.vobl,market=metric==='vobm',label=market?'VOBM':'VOBL',positions=[...(s.positions||[])].sort((a,b)=>{
      const rank=p=>{const slot=p.replace(/\d+$/,'');return ({QB:0,RB:1,WR:2,TE:3,K:5})[slot]??(slot.includes('/')||slot.includes('FLEX')?4:6);};
      return rank(a)-rank(b)||a.localeCompare(b,undefined,{numeric:true});
    });
    const rows=(s.rows||[]).map(r=>{
      const values=market?r.market_values:r.values,total=market?r.market_total:r.total;
      return `<tr><td class="manager">${esc(manager(r.team_id))}</td><td class="${signClass(total)}">${n(total)}</td>${positions.map(p=>`<td class="${signClass(values?.[p])}">${n(values?.[p])}</td>`).join('')}</tr>`;
    }).join('');
    const history=s.weekly_baselines||[],weeks=[...new Set(history.map(r=>r.week))].sort((a,b)=>a-b);
    const prefix=market?'market':'baseline';
    const pointsAt=(week,position)=>history.find(r=>r.week===week&&r.position===position)?.[prefix+'_points'];
    const sumPoints=values=>values.length&&values.every(v=>v!=null&&Number.isFinite(Number(v)))?values.reduce((a,v)=>a+Number(v),0):null;
    const weekTotals=weeks.map(w=>sumPoints(positions.map(p=>pointsAt(w,p))));
    const totalCell=value=>`<td><strong>${n(value)}</strong> pts</td>`;
    const footer=`<tr><th scope="row">Total</th>${totalCell(sumPoints(weekTotals))}${positions.map(p=>totalCell(sumPoints(weeks.map(w=>pointsAt(w,p))))).join('')}</tr>`;
    const weekly=weeks.map((w,i)=>`<tr><th scope="row">Week ${w}</th>${totalCell(weekTotals[i])}${positions.map(p=>{
      const r=history.find(r=>r.week===w&&r.position===p),name=r?.[prefix+'_player_name'],points=r?.[prefix+'_points'];
      return `<td>${esc(name||'Unavailable')}<br><strong>${n(points)}</strong> pts</td>`;
    }).join('')}</tr>`).join('');
    return `<h3>${label} by team and lineup slot</h3><div class="table-wrap"><table><thead><tr><th>Team</th><th>Total (${label})</th>${positions.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <h3>${label} comparison players by week</h3><p>Each cell shows the player used for that slot and their points for that week.</p>${weeks.length?`<div class="table-wrap"><table><thead><tr><th>Week</th><th>Total</th>${positions.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead><tbody>${weekly}</tbody><tfoot>${footer}</tfoot></table></div>`:'<div class="empty">Weekly comparison players are unavailable in this report. Regenerate it from the archived data.</div>'}`;
  }

  function renderVobl(){
    const s=data.vobl;if(!s)return '';
    return sectionShell('vobl','08','Roster value','Value Over Baseline — Expanded',s.description,
      `<label for="baseline-metric">Comparison for both charts </label><select id="baseline-metric" aria-controls="baseline-views"><option value="vobl">VOBL — League baseline</option><option value="vobm">VOBM — Market baseline</option></select><div id="baseline-views" aria-live="polite">${baselineViews('vobl')}</div>`);
  }

  const oddsMetrics = {make_playoffs:'Playoffs', division:'Division', wildcard:'Wildcard', bye:'Bye', last_place:'Last'};
  let selectedOddsManager = null;
  function playoffHistoryChart(metric){
    const history=data.playoff_odds?.history||[];
    if(!history.length)return '<div class="empty">No weekly odds history available.</div>';
    const weeks=history.map(h=>Number(h.week));
    const first=Math.min(...weeks),last=Math.max(...weeks);
    const x=w=>60+(w-first)/Math.max(1,last-first)*800;
    const y=v=>290-v*250;
    const colors=['#355f80','#9b413c','#527944','#855b99','#ab6b25','#247e80','#ad4779','#626bb0','#6d692a','#954d24','#38715b','#71534c'];
    const ids=[...new Set(history.flatMap(h=>(h.rows||[]).map(r=>String(r.team_id))))];
    let hasPoints=false;
    const lines=ids.map((id,i)=>{
      const color=colors[i%colors.length];
      const selected=selectedOddsManager===id;
      let labels='';
      let path='',connected=false,points='';
      history.forEach(h=>{
        const value=(h.rows||[]).find(r=>String(r.team_id)===id)?.[metric];
        if(value==null||!Number.isFinite(Number(value))){connected=false;return;}
        hasPoints=true;
        const px=x(Number(h.week)),py=y(Number(value));
        path+=`${connected?'L':'M'}${px},${py} `;connected=true;
        const tip=`${manager(id)} · Week ${Number(h.week)} · ${oddsMetrics[metric]}: ${pct(value)}`;
        points+=`<circle cx="${px}" cy="${py}" r="5" fill="${color}" data-odds-tip="${esc(tip)}"><title>${esc(tip)}</title></circle>`;
        if(selected)labels+=`<text x="${px}" y="${py-10}" text-anchor="middle" fill="${color}" style="paint-order:stroke;stroke:white;stroke-width:4px;pointer-events:none;font-weight:700">${pct(value)}</text>`;
      });
      return `<g data-odds-manager="${esc(id)}" style="cursor:pointer;opacity:${selectedOddsManager===null||selected?1:.18}"><path d="${path}" fill="none" stroke="transparent" stroke-width="18" pointer-events="stroke"/><path d="${path}" fill="none" stroke="${color}" stroke-width="${selected?3:2}" pointer-events="none"/>${points}${labels}</g>`;
    }).join('');
    const grid=[0,.25,.5,.75,1].map(v=>`<line x1="60" x2="860" y1="${y(v)}" y2="${y(v)}" stroke="#d5d1c7"/><text x="50" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`).join('');
    const ticks=weeks.map(w=>`<text x="${x(w)}" y="312" text-anchor="middle">${w}</text>`).join('');
    const legend=ids.map((id,i)=>`<button type="button" data-odds-manager="${esc(id)}" aria-pressed="${selectedOddsManager===id}" style="font:inherit;padding:6px;border:1px solid ${selectedOddsManager===id?colors[i%colors.length]:'transparent'};background:white;cursor:pointer"><i style="background:${colors[i%colors.length]}"></i>${esc(manager(id))}</button>`).join('');
    const detail=selectedOddsManager===null?'':`<h4>${esc(manager(selectedOddsManager))} — weekly percentages</h4><button type="button" data-odds-clear>Show all managers</button><div class="table-wrap"><table><thead><tr><th>Week</th>${Object.values(oddsMetrics).map(label=>`<th>Total (${label})</th>`).join('')}</tr></thead><tbody>${history.map(h=>{const row=(h.rows||[]).find(r=>String(r.team_id)===selectedOddsManager);return `<tr><td>${Number(h.week)}</td>${Object.keys(oddsMetrics).map(key=>`<td>${pct(row?.[key])}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div>`;
    const missing=history.filter(h=>h.unavailable_reason).map(h=>`Week ${Number(h.week)}: ${esc(h.unavailable_reason)}`).join('<br>');
    return `<div id="odds-tooltip" role="status" style="min-height:2.5em;font-size:12px;padding:8px 0">Hover over a line or point for percentages.</div>${hasPoints?`<div style="overflow-x:auto"><svg viewBox="0 0 900 345" role="group" aria-label="${oddsMetrics[metric]} odds by week for each manager" style="width:100%;min-width:540px;font-size:12px"><title>${oddsMetrics[metric]} odds by week</title>${grid}${ticks}${lines}<text x="460" y="337" text-anchor="middle">Week</text></svg></div><div class="legend" style="flex-wrap:wrap">${legend}</div>`:'<div class="empty">No weekly odds available for this selection.</div>'}${detail}<div class="tiny-note">Each point uses data available through that week. Missing odds appear as gaps. Hover for percentages. Click or tap a line or manager name to show all their weekly percentages; select again to clear.${missing?`<br>${missing}`:''}</div>`;
  }

  function renderPlayoffs(){
    const s=data.playoff_odds;if(!s)return '';
    const sorted=[...(s.rows||[])].sort((a,b)=>(b.make_playoffs??0)-(a.make_playoffs??0));
    const bars=sorted.map(r=>`<div class="odds-row"><span class="manager">${esc(manager(r.team_id))}</span><span class="odds-track"><span style="width:${Math.max(0,Math.min(100,(r.make_playoffs??0)*100))}%"></span></span><span class="odds-pct">${pct(r.make_playoffs)}</span><span class="odds-last">${pct(r.last_place)} last</span></div>`).join('');
    const rows=sorted.map(r=>`<tr><td class="manager">${esc(manager(r.team_id))}</td><td>${pct(r.make_playoffs)}</td><td>${pct(r.division)}</td><td>${pct(r.wildcard)}</td><td>${pct(r.bye)}</td><td>${pct(r.last_place)}</td></tr>`).join('');
    const note=s.simulation_count?`<div class="tiny-note">${Number(s.simulation_count).toLocaleString()} simulations.</div>`:'';
    return sectionShell('playoffs','09','Season outlook','Playoff Odds',s.description,`<div class="grid grid-2"><div class="odds">${bars}</div><div class="table-wrap"><table><thead><tr><th>Manager</th><th>Playoffs</th><th>Division</th><th>Wildcard</th><th>Bye</th><th>Last</th></tr></thead><tbody>${rows}</tbody></table></div></div>${note}<div class="chartbox" style="margin-top:20px"><div class="chart-title">Odds by Week</div><div class="manager-selector"><label for="playoff-metric">Outcome</label><select id="playoff-metric" aria-controls="playoff-history">${Object.entries(oddsMetrics).map(([value,label])=>`<option value="${value}">${label}</option>`).join('')}</select></div><div id="playoff-history" aria-live="polite">${playoffHistoryChart('make_playoffs')}</div></div>`);
  }

  function stackedChart(rows,buckets,title){
    const known=r=>buckets.every(b=>r.values?.[b]!=null&&Number.isFinite(Number(r.values[b])));
    const totals=(rows||[]).map(r=>known(r)?buckets.reduce((a,b)=>a+Number(r.values[b]),0):null);
    const positive=(rows||[]).map(r=>known(r)?buckets.reduce((a,b)=>a+Math.max(0,Number(r.values[b])),0):0);
    const negative=(rows||[]).map(r=>known(r)?buckets.reduce((a,b)=>a+Math.min(0,Number(r.values[b])),0):0);
    const high=Math.max(1,...positive),low=Math.min(0,...negative),scale=220/(high-low),zero=35+high*scale;
    const colors=['#355f80','#759066','#a9aa9d','#b67e58'];
    const bars=(rows||[]).map((r,i)=>{
      let up=zero,down=zero;
      const segments=known(r)?buckets.map((b,j)=>{
        const v=Number(r.values[b]),height=Math.abs(v)*scale,y=v>=0?up-height:down;
        if(v>=0)up=y;else down+=height;
        const label=height>=16?`<text x="55" y="${y+height/2}" dominant-baseline="central" text-anchor="middle" fill="${j===0?'white':'#111'}" font-size="11">${n(v)}</text>`:'';
        return `<g><title>${esc(b)}: ${n(v)}</title><rect x="12" y="${y}" width="86" height="${height}" fill="${colors[j%colors.length]}"/>${label}</g>`;
      }).join(''):'';
      return `<div class="draft-bar"><svg viewBox="0 0 110 270" role="img" aria-label="${esc(manager(r.team_id))}: total ${totals[i]==null?'unavailable':n(totals[i])}"><text x="55" y="${35+high*scale-positive[i]*scale-9}" text-anchor="middle" font-size="12" font-weight="bold">${n(totals[i])}</text><line x1="5" x2="105" y1="${zero}" y2="${zero}" stroke="#aeb8c2"/>${segments}</svg><div class="barlabel">${esc(manager(r.team_id))}</div></div>`;
    }).join('');
    const legend=buckets.map((b,j)=>`<span><i class="s${j+1}"></i>${esc(b)}</span>`).join('');
    const values=(rows||[]).map((r,i)=>`<tr><td class="manager">${esc(manager(r.team_id))}</td>${buckets.map(b=>`<td>${n(r.values?.[b])}</td>`).join('')}<td><strong>${n(totals[i])}</strong></td></tr>`).join('');
    return `<div class="chartbox"><div class="chart-title">${esc(title)}</div><div class="draft-bars">${bars}</div><div class="legend">${legend}</div><p class="tiny-note">Totals appear above each bar. The table includes every value, including segments too small to label.</p><div class="table-wrap"><table><thead><tr><th>Team</th>${buckets.map(b=>`<th>${esc(b)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${values}</tbody></table></div></div>`;
  }

  function renderDraft(){
    const s=data.draft_analysis;if(!s)return '';
    const buckets=s.buckets||[];
    return sectionShell('draft','10','Draft capital',"It's Not The Size of Your Draft, It's How You Use It",s.description,`<div class="grid grid-stack">${stackedChart(s.historical,buckets,'Historical Points From Rounds')}${stackedChart(s.optimal,buckets,'Optimal Points From Rounds')}</div>`);
  }

  const html=[renderBoned(),renderBonedTotal(),renderFreaky(),renderBhole(),renderStuds(),renderGrower(),renderExpertise(),renderVobl(),renderPlayoffs(),renderDraft()].filter(Boolean).join('');
  document.getElementById('sections').innerHTML=html;
  const metricTooltip=document.createElement('div');
  metricTooltip.id='metric-tooltip';metricTooltip.className='metric-tooltip';
  metricTooltip.setAttribute('role','tooltip');metricTooltip.hidden=true;
  document.body.appendChild(metricTooltip);
  let metricHelpButton=null,metricHelpTimer;
  function hideMetricHelp(){
    clearTimeout(metricHelpTimer);
    metricHelpButton?.removeAttribute('aria-describedby');
    metricHelpButton=null;metricTooltip.hidden=true;
  }
  function showMetricHelp(button){
    hideMetricHelp();metricHelpButton=button;
    metricTooltip.textContent=expertiseHelp[button.dataset.metricHelp];
    metricTooltip.hidden=false;button.setAttribute('aria-describedby',metricTooltip.id);
    const rect=button.getBoundingClientRect(),tip=metricTooltip.getBoundingClientRect();
    metricTooltip.style.left=`${Math.max(12,Math.min(rect.left,window.innerWidth-tip.width-12))}px`;
    metricTooltip.style.top=`${Math.max(12,rect.bottom+tip.height+12>window.innerHeight?rect.top-tip.height-8:rect.bottom+8)}px`;
  }
  document.querySelectorAll('.metric-help').forEach(button=>{
    button.addEventListener('pointerenter',()=>showMetricHelp(button));
    button.addEventListener('focus',()=>showMetricHelp(button));
    button.addEventListener('click',()=>showMetricHelp(button));
    button.addEventListener('pointerleave',event=>{
      if(document.activeElement!==button&&!metricTooltip.contains(event.relatedTarget))metricHelpTimer=setTimeout(hideMetricHelp,150);
    });
    button.addEventListener('blur',hideMetricHelp);
  });
  metricTooltip.addEventListener('pointerenter',()=>clearTimeout(metricHelpTimer));
  metricTooltip.addEventListener('pointerleave',()=>{
    if(document.activeElement!==metricHelpButton)hideMetricHelp();
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape')hideMetricHelp();});
  document.addEventListener('click',event=>{
    if(!event.target.closest('.metric-help')&&!metricTooltip.contains(event.target))hideMetricHelp();
  });
  window.addEventListener('resize',hideMetricHelp);
  document.addEventListener('scroll',hideMetricHelp,true);
  document.getElementById('baseline-metric')?.addEventListener('change',event=>{
    document.getElementById('baseline-views').innerHTML=baselineViews(event.target.value);
  });
  document.getElementById('playoff-metric')?.addEventListener('change',event=>{
    document.getElementById('playoff-history').innerHTML=playoffHistoryChart(event.target.value);
  });
  const oddsChart=document.getElementById('playoff-history');
  oddsChart?.addEventListener('click',event=>{
    const target=event.target.closest('[data-odds-manager]');
    if(!target&&!event.target.closest('[data-odds-clear]'))return;
    selectedOddsManager=target&&target.dataset.oddsManager!==selectedOddsManager?target.dataset.oddsManager:null;
    oddsChart.innerHTML=playoffHistoryChart(document.getElementById('playoff-metric').value);
  });
  oddsChart?.addEventListener('pointermove',event=>{
    const group=event.target.closest('g[data-odds-manager]');
    if(!group)return;
    const points=Array.from(group.querySelectorAll('circle[data-odds-tip]'));
    const nearest=points.reduce((best,point)=>{
      const rect=point.getBoundingClientRect();
      const distance=Math.abs(event.clientX-(rect.left+rect.width/2));
      return !best||distance<best.distance?{point,distance}:best;
    },null);
    if(nearest)document.getElementById('odds-tooltip').textContent=nearest.point.dataset.oddsTip;
  });
  document.getElementById('boned-manager')?.addEventListener('change',event=>{
    document.querySelectorAll('#boned-manager-detail .manager-card').forEach(card=>{
      card.hidden=card.dataset.managerIndex!==event.target.value;
    });
  });
})();
</script>
</body>
</html>
